<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thesis</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fbfaf7;
        --ink: #1f2528;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(90deg, rgba(31, 37, 40, 0.035) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(rgba(31, 37, 40, 0.026) 1px, transparent 1px) 0 0 / 48px 48px,
          var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      h1 {
        font-size: clamp(48px, 10vw, 96px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <h1>Thesis</h1>
  </body>
</html>
